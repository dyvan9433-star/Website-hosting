<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Footer</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #111;
      color: #fff;
    }

    footer {
      background: linear-gradient(135deg, #1a1a1a, #222);
      padding: 50px 20px 20px;
    }

    .footer-top {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 30px;
      max-width: 1100px;
      margin: auto;
    }

    .footer-box {
      flex: 1 1 250px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo img {
      width: 120px;
      height: auto;
      object-fit: contain;
    }

    .logo span {
      display: block;
      font-size: 14px;
      color: #aaa;
    }

    h3 {
      margin-bottom: 15px;
      font-weight: 500;
    }

    .footer-box p {
      color: #bbb;
      line-height: 1.6;
      font-size: 14px;
    }

    .divider {
      height: 1px;
      background: #333;
      margin: 40px 0 20px;
    }

    .footer-bottom {
      text-align: center;
    }

    .socials {
      margin: 10px 0;
    }

    .socials a {
      margin: 0 10px;
      font-size: 18px;
      color: #bbb;
      transition: 0.3s;
    }

    .socials a:hover {
      transform: translateY(-3px);
    }

    .fa-facebook:hover { color: #1877f2; }
    .fa-instagram:hover { color: #e4405f; }
    .fa-telegram:hover { color: #0088cc; }

    .copyright {
      font-size: 14px;
      color: #888;
    }

    .highlight {
      color: #4da6ff;
    }

    .design {
      color: orange;
    }

    .scroll-top {
      font-size: 22px;
      cursor: pointer;
      margin-bottom: 10px;
      display: inline-block;
      transition: 0.3s;
    }

    .scroll-top:hover {
      transform: translateY(-5px);
      color: #4da6ff;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .footer-top {
        flex-direction: column;
        text-align: center;
        gap: 20px;
      }

      .footer-box {
        flex: unset;
      }

      .logo img {
        margin: auto;
      }
    }
  </style>
</head>
<body>

<footer>

  <!-- TOP SECTION -->
  <div class="footer-top">

    <!-- Logo -->
    <div class="footer-box">
      <div class="logo">
        <img src="https://via.placeholder.com/150x50?text=Logo" alt="logo">
      </div>
    </div>

    <!-- Work with us -->
    <div class="footer-box">
      <h3>Work with us</h3>
      <p>info@noname.design<br>+855 (0) 70770571</p>
    </div>

    <!-- Address -->
    <div class="footer-box">
      <h3>Address</h3>
      <p>#I86, National Road 3, Sangkat Chom Chao II,<br>Khan Porsenchey, Phnom Penh, CAMBODIA.</p>
    </div>

  </div>

  <div class="divider"></div>

  <!-- BOTTOM SECTION -->
  <div class="footer-bottom">

    <div class="scroll-top" onclick="scrollToTop()">
      <i class="fas fa-arrow-up"></i>
    </div>

    <h3>Socials</h3>

    <div class="socials">
      <a href="https://facebook.com" target="_blank"><i class="fab fa-facebook"></i></a>
      <a href="https://t.me" target="_blank"><i class="fab fa-telegram"></i></a>
      <a href="https://instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
    </div>

    <div class="copyright">
      © 2026 Website => <span class="highlight">noname</span> <= for <span class="design">Design</span> and <span>Digital</span>
    </div>

  </div>

</footer>

<script>
  function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>

</body>
</html>
