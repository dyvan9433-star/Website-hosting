<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fixed Premium Navbar</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<style>

/* ✅ IMPORTANT FIX: body spacing for fixed navbar */
body {
  padding-top: 70px;
  transition: 0.3s;
}

/* ================= NAVBAR ================= */
.navbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 9999;

  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}

/* Logo */
.logo-img {
  width: 38px;
  height: 38px;
  border-radius: 10px;
}

/* Menu */
.nav-link {
  font-size: 14px;
  font-weight: 500;
  color: #555 !important;
  display: flex;
  align-items: center;
  gap: 6px;
  position: relative;
}

.nav-link i {
  font-size: 16px;
}

/* Active */
.nav-link.active {
  color: #6a5cff !important;
  font-weight: 600;
}

.nav-link.active::after {
  content: "";
  position: absolute;
  bottom: -6px;
  left: 0;
  width: 100%;
  height: 2px;
  background: #6a5cff;
  border-radius: 5px;
}

/* Hover */
.nav-link:hover {
  color: #6a5cff !important;
}

/* Buttons */
.header-actions button {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  border: 1px solid #ddd;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Offcanvas */
.offcanvas {
  width: 260px;
}

/* ================= DARK MODE ================= */
.dark-mode {
  background: #121212;
  color: white;
}

.dark-mode .navbar {
  background: rgba(30,30,30,0.9) !important;
}

.dark-mode .nav-link {
  color: #ccc !important;
}

.dark-mode .nav-link.active::after {
  background: #8f7bff;
}

.dark-mode .header-actions button {
  background: #2a2a2a;
  border: 1px solid #444;
  color: white;
}

.dark-mode .offcanvas {
  background: #1e1e1e;
  color: white;
}

.dark-mode .list-group-item {
  background: transparent;
  color: #ddd;
  border: none;
}

.dark-mode .list-group-item:hover {
  background: #2a2a2a;
}

/* Responsive */
@media (max-width: 991px) {
  body {
    padding-top: 65px;
  }
}

</style>
</head>

<body id="body">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg px-3">

  <div class="container-fluid">

    <!-- Logo -->
    <a class="navbar-brand d-flex align-items-center gap-2" href="#">
      <img src="https://via.placeholder.com/40" class="logo-img">
      <strong>RothaTech</strong>
    </a>

    <!-- Desktop Menu -->
    <div class="collapse navbar-collapse justify-content-center d-none d-lg-flex">
      <ul class="navbar-nav gap-4">

        <li class="nav-item"><a class="nav-link active" href="#"><i class="bi bi-house"></i> Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-kanban"></i> Projects</a></li>
        <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-camera"></i> Studio</a></li>
        <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-bar-chart"></i> Insights</a></li>
        <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-envelope"></i> Contact</a></li>

      </ul>
    </div>

    <!-- Actions -->
    <div class="d-flex align-items-center gap-2 header-actions">

      <button onclick="toggleMode()">
        <i class="bi bi-moon"></i>
      </button>

      <button class="d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu">
        <i class="bi bi-list"></i>
      </button>

    </div>

  </div>
</nav>

<!-- MOBILE MENU -->
<div class="offcanvas offcanvas-start" id="mobileMenu">

  <div class="offcanvas-header">
    <h5>Menu</h5>
    <button class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>

  <div class="offcanvas-body">

    <div class="list-group">

      <a class="list-group-item list-group-item-action d-flex align-items-center gap-2" href="#">
        <i class="bi bi-house"></i> Home
      </a>

      <a class="list-group-item list-group-item-action d-flex align-items-center gap-2" href="#">
        <i class="bi bi-kanban"></i> Projects
      </a>

      <a class="list-group-item list-group-item-action d-flex align-items-center gap-2" href="#">
        <i class="bi bi-camera"></i> Studio
      </a>

      <a class="list-group-item list-group-item-action d-flex align-items-center gap-2" href="#">
        <i class="bi bi-bar-chart"></i> Insights
      </a>

      <a class="list-group-item list-group-item-action d-flex align-items-center gap-2" href="#">
        <i class="bi bi-envelope"></i> Contact
      </a>

    </div>

  </div>
</div>
<img src="./assets/image/banner-nuck-center-250701-003.jpg" alt="">
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
function toggleMode() {
  document.getElementById("body").classList.toggle("dark-mode");
}
</script>

</body>
</html>
