<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clean Animated Slider</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* SLIDER */
.slider {
  width: 90%;
  max-width: 1000px;
  margin: 60px auto;
  overflow: hidden;
  border-radius: 15px;
  position: relative;
}

/* SLIDES */
.slides {
  display: flex;
  transition: transform 0.6s ease;
}

.slide {
  min-width: 100%;
  position: relative;
}

.slide img {
  width: 100%;
  height: 480px;
  object-fit: cover;
  filter: brightness(0.7);
}

/* TEXT */
.text {
  position: absolute;
  bottom: 40px;
  left: 40px;
  color: white;
  max-width: 450px;

  opacity: 0;
  transform: translateY(20px) scale(0.95);
}

.slide.active .text {
  animation: popIn 0.8s ease forwards;
}

@keyframes popIn {
  0% {
    opacity: 0;
    transform: translateY(20px) scale(0.9);
  }
  60% {
    transform: translateY(-5px) scale(1.02);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.text h1 {
  font-size: 28px;
  margin-bottom: 8px;
}

.text p {
  font-size: 14px;
  color: #ddd;
  line-height: 1.5;
}

/* =========================
   BUTTONS (RENAMED)
========================= */
.slider-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(255,255,255,0.15);
  border: none;
  color: white;
  padding: 10px 14px;
  cursor: pointer;
  font-size: 18px;
  border-radius: 10px;
  transition: 0.3s;
  z-index: 10;
}

.slider-btn:hover {
  background: rgba(255,255,255,0.3);
}

.slider-btn.prev { left: 10px; }
.slider-btn.next { right: 10px; }

/* DOTS */
.dots {
  position: absolute;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
}

.dots span {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(255,255,255,0.4);
  cursor: pointer;
  transition: 0.3s;
}

.dots span.active {
  background: white;
  transform: scale(1.2);
}

/* MOBILE */
@media (max-width: 768px) {
  .slide img {
    height: 320px;
  }

  .text h1 {
    font-size: 20px;
  }

  .text p {
    font-size: 12px;
  }
}
</style>
</head>

<body>

<div class="slider">

  <div class="slides">

    <div class="slide">
      <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c">
      <div class="text">
        <h1>Cyber Data Network</h1>
        <p>Global secure networks connecting the digital world.</p>
      </div>
    </div>

    <div class="slide active">
      <img src="https://images.unsplash.com/photo-1677442136019-21780ecad995">
      <div class="text">
        <h1>AI Digital World</h1>
        <p>Artificial intelligence powering the future of automation and smart systems.</p>
      </div>
    </div>

    <div class="slide">
      <img src="https://images.unsplash.com/photo-1555066931-4365d14bab8c">
      <div class="text">
        <h1>Digital Coding</h1>
        <p>Clean and scalable programming for modern applications.</p>
      </div>
    </div>

  </div>

  <!-- RENAMED BUTTONS -->
  <button class="slider-btn prev">&#10094;</button>
  <button class="slider-btn next">&#10095;</button>

  <div class="dots"></div>

</div>

<script>
const slides = document.querySelector(".slides");
const slide = document.querySelectorAll(".slide");
const dotsContainer = document.querySelector(".dots");

let index = 0;

/* DOTS */
slide.forEach((_, i) => {
  const dot = document.createElement("span");
  dot.addEventListener("click", () => {
    index = i;
    update();
  });
  dotsContainer.appendChild(dot);
});

const dots = document.querySelectorAll(".dots span");

function update() {
  slides.style.transform = `translateX(${-index * 100}%)`;

  slide.forEach((s, i) => {
    s.classList.toggle("active", i === index);
  });

  dots.forEach((d, i) => {
    d.classList.toggle("active", i === index);
  });
}

/* BUTTONS (UPDATED CLASS NAME) */
document.querySelector(".slider-btn.next").addEventListener("click", () => {
  index = (index + 1) % slide.length;
  update();
});

document.querySelector(".slider-btn.prev").addEventListener("click", () => {
  index = (index - 1 + slide.length) % slide.length;
  update();
});

/* AUTO SLIDE */
setInterval(() => {
  index = (index + 1) % slide.length;
  update();
}, 4000);

/* INIT */
update();
</script>

</body>
</html>
