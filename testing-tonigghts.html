<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects Layout</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial;
    }

    /* ===== LAYOUT ===== */
    .layout {
      display: flex;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 240px;
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;

      background: linear-gradient(180deg, #0f172a, #1e293b);
      color: white;
      padding: 20px;

      display: flex;
      flex-direction: column;
    }

    /* logo */
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    /* menu */
    .menu {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .menu button {
      display: flex;
      gap: 10px;
      align-items: center;

      padding: 12px;
      border: none;
      border-radius: 12px;

      background: rgba(255, 255, 255, 0.08);
      color: white;

      cursor: pointer;
      transition: 0.2s;
    }

    .menu button:hover {
      background: #3b82f6;
      transform: translateX(5px);
    }

    .menu button.active {
      background: #2563eb;
    }

    /* ===== CONTENT ===== */
    .content {
      margin-left: 240px;
      width: calc(100% - 240px);
      padding: 20px;
    }

    /* navbar */
    .navbar {
      padding: 15px;
      background: #f3f4f6;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    /* grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    /* card */
    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .card h3 {
      padding: 10px;
    }

    /* ===== MOBILE ===== */
    @media (max-width: 768px) {

      .sidebar {
        transform: translateX(-100%);
        transition: 0.3s;
        position: fixed;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .content {
        margin-left: 0;
        width: 100%;
      }

      .grid {
        grid-template-columns: repeat(1, 1fr);
      }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

  <div class="layout">

    <!-- 🔥 SIDEBAR -->
    <div class="sidebar">

      <div class="logo">
        <i class="fas fa-folder-open"></i>
        <span>My Project</span>
      </div>

      <div class="menu">
        <button class="active" onclick="filter('all', this)">
          <i class="fas fa-border-all"></i> All
        </button>

        <button onclick="filter('Festival', this)">
          <i class="fas fa-music"></i> Festival
        </button>

        <button onclick="filter('Event', this)">
          <i class="fas fa-calendar"></i> Event Programs
        </button>

        <button onclick="filter('Product', this)">
          <i class="fas fa-box"></i> Product Display
        </button>
      </div>

    </div>

    <!-- 🔥 CONTENT -->
    <div class="content">

      <div class="navbar">
        <h2>Projects</h2>
      </div>

      <div class="grid">

        <div class="card" data-type="Product">
          <img src="img1.jpg">
          <h3>Selling drinks</h3>
        </div>

        <div class="card" data-type="Festival">
          <img src="img2.jpg">
          <h3>Festival Design</h3>
        </div>

        <div class="card" data-type="Event">
          <img src="img3.jpg">
          <h3>Event Program</h3>
        </div>

      </div>

    </div>

  </div>

  <script>function filter(type, btn) {
  const cards = document.querySelectorAll(".card");
  const buttons = document.querySelectorAll(".menu button");

  buttons.forEach(b => b.classList.remove("active"));
  btn.classList.add("active");

  cards.forEach(card => {
    const match = type === "all" || card.dataset.type === type;
    card.style.display = match ? "block" : "none";
  });
}</script>
</body>

</html>
