<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Hero AOS</title>

<link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

html,body{
    width:100%;
    overflow-x:hidden;
}

/* WRAPPER */
.hero-wrapper{
    position:relative;
    min-height:100vh;
    overflow:hidden;
}

/* BACKGROUND (NOT FIXED ANYMORE) */
.hero-bg{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:80vh;
    z-index:0;
    overflow:hidden;
    pointer-events:none;

    background:
        radial-gradient(circle at 20% 20%, rgba(0,212,255,.15), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(255,215,0,.10), transparent 35%),
        linear-gradient(180deg,#020611,#07111f,#050914);
}

.hero-glow{
    position:absolute;
    width:clamp(280px,40vw,600px);
    height:clamp(280px,40vw,600px);
    border-radius:50%;
    filter:blur(110px);
    opacity:.6;
}

.hero-glow--primary{
    top:-180px;
    left:-180px;
    background:radial-gradient(circle,rgba(0,212,255,.25),transparent 65%);
}

.hero-glow--secondary{
    bottom:-180px;
    right:-180px;
    background:radial-gradient(circle,rgba(255,215,0,.18),transparent 65%);
}

/* HERO */
.hero-section{
    position:relative;
    z-index:2;

    width:90%;
    max-width:1100px;
    margin:100px auto;
    padding:clamp(40px,6vw,90px) clamp(18px,5vw,70px);

    text-align:center;

    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.12);
    border-radius:28px;
    backdrop-filter:blur(25px);

    box-shadow:
        0 25px 60px rgba(0,0,0,.45),
        0 0 40px rgba(0,212,255,.08);

    overflow:hidden;
}

/* shine */
.hero-section::before{
    content:"";
    position:absolute;
    inset:0;
    left:-120%;
    background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,.06),
        transparent
    );
    transform:skewX(-20deg);
    animation:shine 6s infinite;
}

/* bottom line */
.hero-section::after{
    content:"";
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:0;

    width:220px;
    height:3px;
    background:linear-gradient(
        90deg,
        transparent,
        #00d4ff,
        #ffffff,
        #00d4ff,
        transparent
    );
    box-shadow:0 0 20px rgba(0,212,255,.5);
}

/* TEXT */
.hero-badge{
    display:inline-block;
    padding:8px 18px;
    border-radius:999px;
    font-size:13px;
    color:#00d4ff;
    background:rgba(0,212,255,.08);
    border:1px solid rgba(0,212,255,.25);
}

h1{
    margin-top:22px;
    font-size:clamp(30px,6vw,70px);
    font-weight:900;
    color:#fff;
    line-height:1.15;
}

h1 span{
    color:#00d4ff;
}

p{
    margin:24px auto 0;
    max-width:750px;
    font-size:clamp(14px,2vw,18px);
    color:#b8c6d8;
    line-height:1.8;
}

/* ANIMATION */
@keyframes shine{
    0%{ left:-120%; }
    50%{ left:120%; }
    100%{ left:120%; }
}

/* RESPONSIVE */
@media(max-width:768px){
    .hero-section{
        margin:70px auto;
        padding:40px 18px;
        border-radius:22px;
    }

    h1{
        font-size:clamp(26px,8vw,48px);
    }

    p{
        font-size:14px;
    }
}

</style>
</head>

<body>

<section class="hero-wrapper">

    <div class="hero-bg">
        <div class="hero-glow hero-glow--primary"></div>
        <div class="hero-glow hero-glow--secondary"></div>
    </div>

    <section class="hero-section" data-aos="fade-up" data-aos-duration="1000">

        <div class="hero-badge" data-aos="zoom-in" data-aos-delay="200">
            Digital Studio • Creative Agency
        </div>

        <h1 data-aos="fade-up" data-aos-delay="400">
            Build <span>Modern</span><br>
            Studio Experience
        </h1>

        <p data-aos="fade-up" data-aos-delay="600">
            We design and develop high-performance websites, mobile apps, and digital experiences with modern UI/UX systems built for scale.
        </p>

    </section>

</section>

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
AOS.init({
    once:true,
    duration:1000,
    easing:"ease-out"
});
</script>

</body>
</html>
