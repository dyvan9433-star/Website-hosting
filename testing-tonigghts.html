<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image Modal</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  padding: 40px;
}

/* thumbnail */
img.thumb {
  width: 220px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

img.thumb:hover {
  transform: scale(1.05);
}

/* MODAL BACKDROP */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 999;

  align-items: center;
  justify-content: center;
}

.modal.active {
  display: flex;
}

/* WRAPPER */
.modal-content {
  position: relative;
  display: inline-block;
}

/* IMAGE */
.modal-content img {
  width: 80vw;
  height: 80vh;
  object-fit: contain;
  border-radius: 12px;
  animation: zoom 0.25s ease;
}

/* zoom animation */
@keyframes zoom {
  from { transform: scale(0.7); }
  to { transform: scale(1); }
}

/* CLOSE BUTTON pinned on image corner */
.close {
  position: absolute;
  top: 10px;
  right: 10px;

  width: 42px;
  height: 42px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 24px;
  color: #fff;

  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
  border-radius: 50%;

  cursor: pointer;
  transition: 0.25s ease;
}

.close:hover {
  background: red;
  transform: scale(1.1);
}
</style>

</head>

<body>

<h2>Click Image to Open Modal</h2>

<!-- THUMBNAIL IMAGE -->
<img class="thumb" src="https://picsum.photos/500/350" onclick="openModal(this.src)">

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <img id="modalImg">
    <span class="close" id="closeBtn">&times;</span>
  </div>
</div>

<script>
// OPEN MODAL
function openModal(src) {
  document.getElementById("modal").classList.add("active");
  document.getElementById("modalImg").src = src;
}

// CLOSE MODAL
function closeModal() {
  document.getElementById("modal").classList.remove("active");
  document.getElementById("modalImg").src = "";
}

// close button
document.getElementById("closeBtn").onclick = closeModal;

// click outside image
document.getElementById("modal").onclick = function(e) {
  if (e.target === this) {
    closeModal();
  }
};

// ESC key
document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") {
    closeModal();
  }
});
</script>

</body>
</html>
